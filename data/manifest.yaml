#   archive           - archive file name (zip) or null for a single file
#   archive_sha256    - checksum of the downloaded file (optional but recommended)
#   dest              - target directory, relative to the repository root
#   strip_prefixes    - archive entries starting with these are skipped
#   files             - expected files after extraction: relative path -> sha256

